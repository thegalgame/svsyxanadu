  <h1>图勒协会</h1>
  <p class="catline"><span class="cat">世界线用语</span><span class="src-name">r10.txt</span></p>
<p>『<ruby>冥王<rt>めいおう</rt></ruby>の鍵』と『<a class="w" href="../entry1/015_%E7%BF%A0%E7%8E%89%E7%A2%91.html">翠玉碑</a>の欠片』。二つの魔具をヴァルターが手中に収めれば、『トゥーレ』の中でも大きな発言力を得ることができるだろう。</p>

<p>『<a class="w" href="../entry1/022_%E5%86%A5%E7%8E%8B%E4%B9%8B%E9%92%A5.html">冥王之钥</a>』与『<a class="w" href="../entry1/016_%E7%BF%A0%E7%8E%89%E7%A2%91%E7%9A%84%E7%A2%8E%E7%89%87.html">翠玉碑的碎片</a>』。瓦尔特若将这两件魔具收入手中，便能在『图勒』中获得巨大的发言权。</p>

<p>一九一八年　祕密結社『圖勒協會』於德國慕尼黑創立。</p>
<p>一九一八年，秘密结社『图勒协会』于德国慕尼黑创立。【繁体中文】</p>
