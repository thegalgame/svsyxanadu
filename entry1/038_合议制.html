  <h1>合议制</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S096_00_a00.txt</span></p>
<p>一八五四年因垄峰家独断举行仪式引发『災厄』之后，大祭的举办改为由澳城、垄峰、道陵三家合议決定。此为今日<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>祭仪之根本制度。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%A4%A7%E4%BA%8B%E4%BB%B6%E5%B9%B4%E8%A1%A8.txt.html#L12~1854%E5%B9%B4%20%E5%A3%9F%E5%B3%AF%E5%AE%B6%E7%9A%84%E6%B0%8F%E5%AD%90%E7%8D%A8%E6%96%B7%E5%B0%8D%E5%B9%B4%E9%81%8E2" title="跳转到原文对应位置">Lass大事件年表</a>：</p>
<p class="cite"><b>中文翻译</b>「<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>的氏子獨斷對年過20仍未覺醒的人柱舉行儀式，最終引發『災厄』，此後大祭的舉辦改為澳城、壟峯、道陵三家合議的制度。」</p>
</div>
