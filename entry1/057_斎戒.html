  <h1>斎戒</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S102_00_a00.txt</span></p>
<p>「本日より<ruby>大忌比古<rt>おおいみひこ</rt></ruby>神社の式年祭、<ruby>大忌比古御縁奉祝大祭<rt>おおいみひこごえんほうしゅくたいさい</rt></ruby>が無事執り行われるまで、<ruby>斎戒<rt>さいかい</rt></ruby>の期間となります」</p>

<p>「自今日起，至<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的式年祭——<a class="w" href="../entry1/049_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E5%BE%A1%E7%B8%81%E5%A5%89%E7%A5%9D%E5%A4%A7%E7%A5%AD.html">大忌比古御縁奉祝大祭</a>顺利举行为止，皆为斎戒之期」【机器翻译】</p>
