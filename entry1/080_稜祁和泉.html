  <h1>稜祁和泉</h1>
  <p class="catline"><span class="cat">登场人物</span></p>
<p>恂的祖母，旧姓寒河江。照片中身着裙装的女性。怀有寄宿『石』之男孩的女性记忆，也会透过被继承的『石』而复苏；恂所见梦中从仓库取出『鴦』的女性，即二代前继承者<a class="w" href="../entry1/081_%E7%A8%9C%E7%A5%81%E5%85%83.html">稜祁元</a>之妻和泉的记忆。【繁体中文】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L90~A%EF%BC%9A%E8%BA%AB%E7%A9%BF%E8%A3%99%E8%A3%9D%E7%9A%84%E5%A5%B3%E6%80%A7%EF%BC%8C%E6%98%AF%E6%81%82%E7%9A%84%E7%A5%96%E6%AF%8D%E7%A8%9C%E7%A5%81%EF%BC%88" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「身穿裙裝的女性，是恂的祖母稜祁（寒河江）和泉。」</p>
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L94~A%EF%BC%9A%E6%98%AF%E5%AF%A6%E9%9A%9B%E7%99%BC%E7%94%9F%E9%81%8E%E7%9A%84%E4%BA%8B%E6%83%85%E3%80%82%E6%87%B7%E8%91%97%E5%AF%84%E5%AE%BF%E4%BA%86%E3%80%8E" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「那應該是2代前的繼承者<a class="w" href="../entry1/081_%E7%A8%9C%E7%A5%81%E5%85%83.html">稜祁元</a>的妻子・和泉的記憶。」</p>
