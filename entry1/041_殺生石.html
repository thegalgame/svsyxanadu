  <h1>殺生石</h1>
  <p class="catline"><span class="cat">世界观用语</span></p>
<p><a class="w" href="../entry1/040_%E6%B3%A2%E6%99%BA%E7%9A%87%E5%AD%90.html">波智皇子</a>最终抵达<a class="w" href="../entry2/110_%E5%BF%8C%E9%83%A8%E9%87%8E.html">忌部野</a>的殺生石，并以自身肉体将其封印于体内。四散的少女之石中最大的一枚碎片，与<a class="w" href="../entry2/110_%E5%BF%8C%E9%83%A8%E9%87%8E.html">忌部野</a>之石相互牵引融合，使其威力与危害都向外扩大——这便是<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>『石』的由来。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L46~A%EF%BC%9A%E4%BD%B3%E5%9F%8E%E5%B8%82%E5%8E%9F%E6%9C%AC%E7%9A%84%E5%90%8D%E7%A8%B1%E6%98%AF%E3%80%8E%E5%BF%8C%E9%83%A8%E9%87%8E%E3%80%8F%EF%BC%8C%E5%BE%9E" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「皇子在源平合戰的幕後討伐黑齒朵之一族，最終好不容易才抵達<a class="w" href="../entry2/110_%E5%BF%8C%E9%83%A8%E9%87%8E.html">忌部野</a>的殺生石，他以自身的存在為代價，將殺生石封印於體內。」</p>
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L46~A%EF%BC%9A%E4%BD%B3%E5%9F%8E%E5%B8%82%E5%8E%9F%E6%9C%AC%E7%9A%84%E5%90%8D%E7%A8%B1%E6%98%AF%E3%80%8E%E5%BF%8C%E9%83%A8%E9%87%8E%E3%80%8F%EF%BC%8C%E5%BE%9E" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「四散的少女之石中最大的一枚碎片，與<a class="w" href="../entry2/110_%E5%BF%8C%E9%83%A8%E9%87%8E.html">忌部野</a>之石相互牽引融合，使它的威力與危害都向外擴大。」</p>
</div>
