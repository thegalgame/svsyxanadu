  <h1>酉の市</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">059_x_酉の市.txt</span></p>
<p>分布于全国的祭市，本于十一月举行。因大忌比古命的神使为白鸡，<a class="w" href="../entry1/048_%E6%98%9F%E9%B4%BB%E7%A5%AD.html">星鴻祭</a>带浓厚的『酉の市』性格，举行之期（三月下旬至四月上旬）在全国亦属特殊。</p>

<p class="src">（出处：出自《少女神域∽少女天獄》官方设定集）</p>
