  <h1>大和田</h1>
  <p class="catline"><span class="cat">登场人物</span><span class="src-name">S013_01_b00.txt</span></p>
<p><ruby>大和田<rt>おおわだ</rt></ruby>さんという、長い<ruby>髭<rt>ひげ</rt></ruby>を生やした仙人みたいなおじいさんが店主で、家族で店を切り盛りしていた。</p>

<p>经营海产、川鱼老铺的老者，蓄着仙人般长须，与家人一同打理店铺。其孙与恂为学园同班同学。【机器翻译】</p>
