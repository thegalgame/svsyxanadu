  <h1>三座舞</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S021_01_a10.txt</span></p>
<p>一般参拝客が拝観出来るのも三人の巫女が舞う『<ruby>三座舞<rt>さんざまい</rt></ruby>』 までで、どの四座の一人が抜けるかはその年によって異なるといわれる。</p>

<p>一般参拜者仅能观赏由三名巫女起舞的『三座舞』，至于四座中哪一人缺席，则每年不同。【机器翻译】</p>
