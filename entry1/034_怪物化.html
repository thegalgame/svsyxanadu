  <h1>怪物化</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S096_00_a00.txt</span></p>
<p>「<ruby>壟峯<rt>つかみね</rt></ruby>の人間が、年が二十を越えても怪物化しない『石』の保持者をさらい、独断で儀式を行おうとした事件です――今日の合議制の元になった事件」</p>

<p>「那是垄峰家的人，掳走了年过二十仍未怪物化的『石』之持有者、企图独断举行仪式的事件——正是今日<a class="w" href="../entry1/038_%E5%90%88%E8%AE%AE%E5%88%B6.html">合议制</a>之滥觞」</p>

<p>被『石』吸收生気的人类会怪物化。（魔縁）【机器翻译】</p>
