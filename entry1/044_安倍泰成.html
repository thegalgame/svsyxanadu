  <h1>安倍泰成</h1>
  <p class="catline"><span class="cat">世界观用语</span></p>
<p>在<a class="w" href="../entry1/043_%E5%B4%87%E5%BE%B7%E4%B8%8A%E7%9A%87.html">崇德上皇</a>的委托之下，由<a class="w" href="../entry1/025_%E9%98%B4%E9%98%B3%E5%B8%88.html">阴阳师</a>·安倍泰成所指挥，建造了最古老的石壁——为了将『石』的影响封闭在市内而设下的结界。即使是当时最高位的<a class="w" href="../entry1/025_%E9%98%B4%E9%98%B3%E5%B8%88.html">阴阳师</a>，也难以直接封印『石』，耗尽心力也只能建造从远处包围的结界。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L66~A%EF%BC%9A%E6%B2%92%E9%8C%AF%E3%80%82%E6%98%AF%E5%9C%A8%E9%99%B0%E9%99%BD%E5%B8%AB%E3%83%BB%E5%AE%89%E5%80%8D%E6%B3%B0%E6%88%90%E7%9A%84%E6%8C%87%E6%8F%AE" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「是在陰陽師・安倍泰成的指揮之下，為了將『石』的影響封閉在內而建造的。」</p>
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L66~A%EF%BC%9A%E6%B2%92%E9%8C%AF%E3%80%82%E6%98%AF%E5%9C%A8%E9%99%B0%E9%99%BD%E5%B8%AB%E3%83%BB%E5%AE%89%E5%80%8D%E6%B3%B0%E6%88%90%E7%9A%84%E6%8C%87%E6%8F%AE" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「即使是那個時代最高位的陰陽師，也難以將『石』直接封印，花費時間建造從遠處包圍的結界就已經是竭盡全力了。」</p>
</div>
