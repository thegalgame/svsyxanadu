  <h1>神楽</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S007_01_a00.txt</span></p>
<p>「例えば、<ruby>星鴻祭<rt>せいこうさい</rt></ruby>の<ruby>神楽<rt>かぐら</rt></ruby>に用いる剣の扱い方、また、扱うための体の鍛え方などです。初めてのことばかりですが、<ruby>碧織<rt>みおり</rt></ruby>さんには丁寧に教えていただいてます」</p>

<p>「比如<a class="w" href="../entry1/048_%E6%98%9F%E9%B4%BB%E7%A5%AD.html">星鴻祭</a>神楽所用之剑的操持法，以及为操持它而锻炼身体的方法。虽然尽是初次接触之物，但碧織小姐都仔细地教导着我」——神楽为向神奉纳的舞乐，由<a class="w" href="../entry1/052_%E5%A4%A9%E7%A5%9D%E5%BE%A1%E7%8B%90.html">天祝御狐</a>在社殿献舞。【机器翻译】</p>
