  <h1>稜祁元</h1>
  <p class="catline"><span class="cat">登场人物</span></p>
<p>二代前的『石』之宿主（人柱）。约一九七一年大祭举行时死亡。其妻为稜祁（寒河江）和泉。【繁体中文】</p>
