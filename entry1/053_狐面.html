  <h1>狐面</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S035_00_a00.txt</span></p>
<p><a class="w" href="../entry1/052_%E5%A4%A9%E7%A5%9D%E5%BE%A1%E7%8B%90.html">天祝御狐</a>于神楽中所戴的狐狸面具。此意匠亦源自<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>传说——相传大师本体为天狗，其童子多为山天狗、川天狗，而天狗古称『甘木狐』，由此『天狗—狐』意象交融，遂成今日形制。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L120~%E3%81%BE%E3%81%9F%E3%81%93%E3%81%AE%E7%A5%9E%E6%A5%BD%E3%81%A7%E3%81%AF%E7%8B%90%E9%9D%A2%E3%82%92%E8%A2%AB%E3%82%8B%E3%81%93%E3%81%A8%E3%81%8C%E3%81%82%E3%82%8A" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「またこの神楽では狐面を被ることがあり、この意匠も<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>伝説に由来している。」</p>
<p class="cite"><b>中文机翻</b>此外，此神乐中亦会戴狐面，其意匠同样出自<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>传说。</p>
