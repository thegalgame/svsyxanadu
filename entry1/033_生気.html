  <h1>生気</h1>
  <p class="catline"><span class="cat">世界观用语</span></p>
<p>『石』所吸收并蓄积的生命能量。生気被夺的人类会<a class="w" href="../entry1/034_%E6%80%AA%E7%89%A9%E5%8C%96.html">怪物化</a>，进而去寻求献给『石』的祭品——由此构成一条高效的生気收集蓄积循环。『石』最初便是为收集、蓄积名为生気的生命能量而被制造出来的、装置般的存在。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/Lass%E5%AE%98%E6%96%B9%E8%AE%BF%E8%B0%88.txt.html#L70~A%EF%BC%9A%E6%9C%AC%E4%BE%86%E5%8F%AA%E6%9C%89%E5%AF%84%E5%AE%BF%E8%91%97%E3%80%8E%E7%9F%B3%E3%80%8F%E7%9A%84%E7%94%B7%E6%80%A7%E6%9C%83%E8%A2%AB%E7%A8%B1" title="跳转到原文对应位置">Lass官方访谈</a>：</p>
<p class="cite"><b>中文翻译</b>「由於『石』最初就是為了收集並蓄積名為生氣的生命能量而被製造出來的裝置般的存在」</p>
