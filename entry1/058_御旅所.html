  <h1>御旅所</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S005_01_a00.txt</span></p>
<p>「もちろん氏子で、<ruby>蔵神館<rt>くらかんだち</rt></ruby>に通って数十年になる……おっと、<ruby>御旅所<rt>おたびしょ</rt></ruby>のほうが、<ruby>稜祁<rt>たかぎ</rt></ruby>さんの家では通じるのかい？」</p>

<p>祭礼时供神舆停驻、供人礼拜之处。在<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>，<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的『御旅所』与演练神楽的『<a class="w" href="../entry1/060_%E8%94%B5%E7%A5%9E%E9%A4%A8.html">蔵神館</a>』所指相同，<a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>惯称『御旅所』。【机器翻译】</p>
