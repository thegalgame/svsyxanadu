  <h1>淡島</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S041_00_a00.txt</span></p>
<p>「動くな……。動けば<ruby>淡島<rt>あわしま</rt></ruby>の命はないと思え」</p>

<p>「别动……。敢动的话，就别想要淡島的命了」</p>

<p>身为淡島的祥那，实际上与寄宿着『石』的恂一样，天生便具有与『石』亲和性极高的体质。【机器翻译】</p>
