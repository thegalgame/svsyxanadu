  <h1>荒魂与和魂</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S100_00_a00.txt</span></p>
<p>「世に<ruby>彷徨<rt>さまよ</rt></ruby>う<ruby>若宮<rt>わかみや</rt></ruby>様の<ruby>荒魂<rt>あらたま</rt></ruby>を、奥社の<ruby>和魂<rt>にぎたま</rt></ruby>へお導きする……それこそ、<ruby>星鴻祭<rt>せいこうさい</rt></ruby>で最も大切な儀式です」</p>

<p>「将彷徨于世的若宮大人的荒魂，引导至奥社的和魂之处……这正是星鸿祭中最重要的仪式」【机器翻译】</p>
