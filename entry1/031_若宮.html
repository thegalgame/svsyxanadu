  <h1>若宮</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S030_00_b00.txt</span></p>
<p>「<ruby>若宮さま<rt>・・・・</rt></ruby>を守るが我らの使命――だが、それは<ruby>荒魂<rt>あらたま</rt></ruby>が返される日までのこと」</p>

<p>「守护若宮大人是我们的使命——但那只到荒魂归来之日为止」</p>

<p>本來只有寄宿著『石』的男性會被稱為『若宮』，在其血緣下出生的女性則被稱為『淡島』。</p>
<p>原本只有寄宿着『石』的男性会被称为『若宮』，在其血缘下出生的女性则被称为『淡島』。【机器翻译】／【繁体中文】</p>
