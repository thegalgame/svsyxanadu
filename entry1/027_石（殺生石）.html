  <h1>石（殺生石）</h1>
  <p class="catline"><span class="cat">世界观用语</span></p>
<p>『石』有著將人類的生氣吸收並蓄積的特性，被吸收了生氣的人類會<a class="w" href="../entry1/034_%E6%80%AA%E7%89%A9%E5%8C%96.html">怪物化</a>，再去尋求獻給『石』的祭品的人類，是一種有效率的生氣收集蓄積系統。</p>

<p>『石』有着将人类的生気吸收并蓄积的特性；被吸收了生気的人类会<a class="w" href="../entry1/034_%E6%80%AA%E7%89%A9%E5%8C%96.html">怪物化</a>，再去寻求献给『石』的祭品，是一种高效率的生気收集蓄积系统。【繁体中文】</p>
