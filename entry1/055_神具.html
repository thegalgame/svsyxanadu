  <h1>神具</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S007_01_b11.txt</span></p>
<p>「そうです。お兄様の家に伝わっている、例の<ruby>神具<rt>しんぐ</rt></ruby>です。<ruby>迪希<rt>ゆき</rt></ruby>さんの家にも、<ruby>碧織<rt>みおり</rt></ruby>さんの家にもあり……もちろん、私の家にもあります」</p>

<p>「是的。就是哥哥家中相传的那件神具。迪希小姐家有，碧織小姐家也有……当然，我家也有」——四家相传的宝刀，作为神具用于神楽。【机器翻译】</p>
