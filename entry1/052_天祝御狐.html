  <h1>天祝御狐</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S007_01_b00.txt</span></p>
<p>『<ruby>天祝御狐<rt>あめのはふりのみこ</rt></ruby>』とは、社殿にて主祭神である大忌比古命へ奉納する神楽『<ruby><a class="w" href="../entry1/050_%E5%9B%9B%E5%BA%A7%E8%88%9E.html">四座舞</a><rt>しざまい</rt></ruby>』を舞う巫女のこと。</p>

<p>『天祝御狐』，指在社殿中向主祭神大忌比古命献舞神楽『<a class="w" href="../entry1/050_%E5%9B%9B%E5%BA%A7%E8%88%9E.html">四座舞</a>』的巫女。其巫女装束在全国亦属孤例，社传称系模仿<a class="w" href="../entry1/046_%E8%AD%B7%E6%B3%95%E7%AB%A5%E5%AD%90.html">護法童子</a>之姿。</p>
<p>「那位在祭事中正式称作『天祝御狐』，由经验丰富的迪希小姐为中心，为大家指导练习。」【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L115~%E3%80%8E%E5%A4%A9%E7%A5%9D%E5%BE%A1%E7%8B%90%E3%80%8F%EF%BC%88%E3%81%82%E3%82%81%E3%81%AE%E3%81%AF%E3%81%B5%E3%82%8A%E3%81%AE%E3%81%BF%E3%81%93%EF%BC%89%E3%81%A8" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：S007_01_b00.txt）</p>
