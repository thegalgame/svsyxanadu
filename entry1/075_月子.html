  <h1>月子</h1>
  <p class="catline"><span class="cat">登场人物</span><span class="src-name">S016_00_a00.txt</span></p>
<p>このイニシャルには見覚えがあった。たしか、<ruby>菩乃花<rt>ほのか</rt></ruby>さんの親類の人で――名前は、<ruby>月子<rt>つきこ</rt></ruby>さんだったはずだ。</p>

<p>菩乃花的亲属，名为月子。恂在古书中见到署有『Ｔ・Ｈ』的批注，忆及此人。【机器翻译】</p>
