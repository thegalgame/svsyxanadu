  <h1>澳城家</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p><ruby>澳城<rt>おくしろ</rt></ruby>という姓は、『奥津城』、墓を意味する古語に由来する。現在の<ruby>澳城家<rt>おくしろけ</rt></ruby>は<ruby><a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a><rt>かいじょうし</rt></ruby>の最も有力な名士であり、市政への発言権も強い。</p>

<p>『澳城』一姓源自古语『奥津城』，意为坟墓。如今的澳城家是<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>最有势力的名门，对市政也拥有强大的发言权。邸宅位于东部贝寄町。【机器翻译】</p>
