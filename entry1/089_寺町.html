  <h1>寺町</h1>
  <p class="catline"><span class="cat">登场人物</span><span class="src-name">S013_01_c00.txt</span></p>
<p>真新しい店の姿と合わせるように、当時二十代を折り返したばかりの、<ruby>寺町<rt>てらまち</rt></ruby>さんという若い男性が店を一人で切り盛りしていた。</p>

<p>三年前开业的青果店『<a class="w" href="../entry2/165_%E4%B8%89%E6%AD%A9%E8%9B%99.html">三歩蛙</a>』的年轻店主，菩乃花的后辈，亦是曾与她一同周游世界的原冒险家。【机器翻译】</p>
