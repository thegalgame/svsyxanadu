  <h1>護法童子</h1>
  <p class="catline"><span class="cat">世界观用语</span></p>
<p><a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>所役使的蜂之眷属，分别为丹生都童子、俵童子、摩虎羅童子、滝夜叉童子，即『四座』之由来。相传大师本体为天狗，童子多为山天狗、川天狗。</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L116~%E3%80%8E%E5%9B%9B%E5%BA%A7%E8%88%9E%E3%80%8F%E3%81%AE%E5%9B%9B%E5%BA%A7%E3%81%A8%E3%81%AF%E3%80%81%E5%90%8C%E7%A4%BE%E3%81%AE%E4%BC%9D%E8%AA%AC%E4%B8%8A%E3%81%AE" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「『<a class="w" href="../entry1/050_%E5%9B%9B%E5%BA%A7%E8%88%9E.html">四座舞</a>』の四座とは、同社の伝説上の創健者である<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>が使役した護法童子たちのことで、それぞれ「丹生都童子」「俵童子」「摩虎羅童子」「滝夜叉童子」を指す。」</p>
<p class="cite"><b>中文机翻</b>『<a class="w" href="../entry1/050_%E5%9B%9B%E5%BA%A7%E8%88%9E.html">四座舞</a>』的四座，即指该神社传说中创社者<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>所役使的护法童子们，分别为「丹生都童子」「俵童子」「摩虎羅童子」「滝夜叉童子」。</p>
</div>
