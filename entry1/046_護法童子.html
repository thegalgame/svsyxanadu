  <h1>護法童子</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">046_x_護法童子.txt</span></p>
<p><a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>所役使的蜂之眷属，分别为丹生都童子、俵童子、摩虎羅童子、滝夜叉童子，即『四座』之由来。相传大师本体为天狗，童子多为山天狗、川天狗。</p>
