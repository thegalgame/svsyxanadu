  <h1>祖国遗产协会</h1>
  <p class="catline"><span class="cat">世界线用语</span><span class="src-name">zxx-xxx-01-02.txt</span></p>
<p><ruby>祖国遺産協会<rt>アーネンエルベ</rt></ruby>は『カイロスの時計』を研究材料として貸し出す代わりに、あの『<ruby><a class="w" href="../entry1/015_%E7%BF%A0%E7%8E%89%E7%A2%91.html">翠玉碑</a><rt>すいぎょくひ</rt></ruby>の欠片』を交換で貸し出すように要求してきたのだ。</p>

<p>祖国遗产协会（Ahnenerbe）提出：以出借『<a class="w" href="../entry1/020_%E5%8D%A1%E4%BC%8A%E6%B4%9B%E6%96%AF%E4%B9%8B%E9%92%9F.html">卡伊洛斯之钟</a>』作为研究材料为条件，要求交换出借那件『<a class="w" href="../entry1/016_%E7%BF%A0%E7%8E%89%E7%A2%91%E7%9A%84%E7%A2%8E%E7%89%87.html">翠玉碑的碎片</a>』。【机器翻译】</p>
