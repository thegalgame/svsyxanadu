  <h1>卡伊洛斯之钟</h1>
  <p class="catline"><span class="cat">世界线用语</span><span class="src-name">zxx-xxx-01-02.txt</span></p>
<p>『<ruby><a class="w" href="../entry1/015_%E7%BF%A0%E7%8E%89%E7%A2%91.html">翠玉碑</a><rt>すいぎょくひ</rt></ruby>の欠片』は魔力を生み出す魔具の中では最高峰のものだが、似たような力をもった魔具がないわけではない。だが……時の流れを操作することのできる魔具は類を見ない。</p>

<p>『<a class="w" href="../entry1/016_%E7%BF%A0%E7%8E%89%E7%A2%91%E7%9A%84%E7%A2%8E%E7%89%87.html">翠玉碑的碎片</a>』虽是产生魔力的魔具之中的巅峰，但拥有类似力量的魔具并非没有。然而……能够操纵时间流动的魔具（卡伊洛斯之钟）却绝无仅有。【机器翻译】</p>
