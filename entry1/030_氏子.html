  <h1>氏子</h1>
  <p class="catline"><span class="cat">世界观用语</span><span class="src-name">S001_00_a00.txt</span></p>
<p>「何だかんだって……確かに、私の家は昔からの<ruby>氏子<rt>うじこ</rt></ruby>だから、その関係で神社の<ruby>祭事<rt>さいじ</rt></ruby>には、よく参加していたけど……」</p>

<p>『氏子』指信奉、奉祀同一神社的氏神之信徒。<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>以<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>为首，稜祁、澳城、壟峯、道陵四家为有力氏子。</p>
<p>「不管怎么说……我家确实自古以来便是氏子，所以和神社的祭事，一直都有参与……」【机器翻译】</p>
