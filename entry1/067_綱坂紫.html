  <h1>綱坂紫</h1>
  <p class="catline"><span class="cat">登场人物</span></p>
<p>纲坂葵唯一的血亲妹妹，现于遥远的医院住院疗养。患数万人中仅一人的罕病，治疗费用庞大，由<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>代为支付——因此葵无法切断与<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>的羁绊。【中文翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E9%94%81%E7%BC%9A%E4%B9%8B%E7%8B%90%E7%BF%BB%E8%AF%91.txt.html#L210~%E4%B8%BA%E4%BA%86%E8%AE%A9%E7%B4%AB%E8%83%BD%E6%B4%BB%E7%9D%80%EF%BC%8C%E4%B8%BA%E4%BA%86%E4%BB%8A%E5%90%8E%E7%9A%84%E6%B2%BB%E7%96%97%EF%BC%8C%E4%B8%BA%E4%BA%86" title="跳转到原文对应位置">锁缚之狐</a>：</p>
<p class="cite"><b>中文翻译</b>「为了让紫能活着，为了今后的治疗，为了恢复健康，都需要钱。」</p>
</div>
