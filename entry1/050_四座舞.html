  <h1>四座舞</h1>
  <p class="catline"><span class="cat">祭礼·神事</span><span class="src-name">S021_01_a10.txt</span></p>
<p>『四座舞』の四座とは、同社の伝説上の創健者である<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>が使役した<a class="w" href="../entry1/046_%E8%AD%B7%E6%B3%95%E7%AB%A5%E5%AD%90.html">護法童子</a>たちのことで、それぞれ「丹生都童子」「俵童子」「摩虎羅童子」「滝夜叉童子」を指す。</p>

<p>『四座舞』的四座，指同社传说中创社者<a class="w" href="../entry1/045_%E7%A3%90%E8%9C%82%E5%A4%A7%E5%B8%AB.html">磐蜂大師</a>所役使的<a class="w" href="../entry1/046_%E8%AD%B7%E6%B3%95%E7%AB%A5%E5%AD%90.html">護法童子</a>——丹生都童子、俵童子、摩虎羅童子、滝夜叉童子。有趣之处在于：其中一名巫女须彻夜陪伴作为大忌比古命和魂的白鸡，故正式神楽常以剩余三人起舞。</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L116~%E3%80%8E%E5%9B%9B%E5%BA%A7%E8%88%9E%E3%80%8F%E3%81%AE%E5%9B%9B%E5%BA%A7%E3%81%A8%E3%81%AF%E3%80%81%E5%90%8C%E7%A4%BE%E3%81%AE%E4%BC%9D%E8%AA%AC%E4%B8%8A%E3%81%AE" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：S021_01_a10.txt）</p>
