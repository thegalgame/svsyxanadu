  <h1>道陵蕃遵</h1>
  <p class="catline"><span class="cat">学校·机构</span></p>
<p><a class="w" href="../entry2/144_%E9%81%93%E9%99%B5%E8%81%96%E4%BF%AE.html">道陵聖修</a>的叔父。在<a class="w" href="../entry2/135_%E7%A3%90%E9%95%B7%E7%A5%9E%E7%A4%BE.html">磐長神社</a>社务所一隅为教授子女学问而开设私塾，即<a class="w" href="../entry2/138_%E6%83%BA%E9%B3%B3%E9%A4%A8%E5%AD%A6%E5%9C%92.html">惺鳳館学園</a>的前身。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L89~%E3%81%9D%E3%81%AE%E7%A4%BE%E5%8B%99%E6%89%80%E3%81%AE%E4%B8%80%E7%94%BB%E3%81%A7%E3%80%81%E5%89%B5%E8%A8%AD%E8%80%85%E3%81%AE%E5%8F%94%E7%88%B6%E3%80%8C%E9%81%93" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「その社務所の一画で、創設者の叔父「道陵蕃遵（みちおか ばんけい）」が子女に学問を教えるための私塾を開いていたことが学園の前身となる。」</p>
<p class="cite"><b>中文机翻</b>创设者的叔父「道陵蕃遵」曾在社务所一隅开设私塾、教授子弟学问，此即学园的前身。</p>
</div>
