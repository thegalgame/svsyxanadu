  <h1>九頭龍列石群</h1>
  <p class="catline"><span class="cat">佳城市·地名</span></p>
<p>これら石の遺跡は『<ruby>九頭龍列石群<rt>くずりゅうれっせきぐん</rt></ruby>』と呼ばれ、<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>を代表するシンボルのひとつとなっている。</p>

<p>这些石造遗迹被称为『九頭龍列石群』，是<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>的象征之一。此名限定指代自平安时代初期至江户时代后期、长时期内环绕<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>建造的大量石碑，以及天然或人为的石壁。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L23~%E3%81%93%E3%82%8C%E3%82%89%E7%9F%B3%E3%81%AE%E9%81%BA%E8%B7%A1%E3%81%AF%E3%80%8E%E4%B9%9D%E9%A0%AD%E9%BE%8D%E5%88%97%E7%9F%B3%E7%BE%A4%E3%80%8F%E3%81%A8%E5%91%BC" title="跳转到原文对应位置">官方设定集</a>）</p>
