  <h1>磐長神社</h1>
  <p class="catline"><span class="cat">佳城市·地名</span></p>
<p><a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的境外社，规模虽小，作为村社曾汇集附近信仰。<a class="w" href="../entry2/138_%E6%83%BA%E9%B3%B3%E9%A4%A8%E5%AD%A6%E5%9C%92.html">惺鳳館学園</a>现址原建有此社；其社务所一隅，即学园前身私塾所在。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L88~%E5%85%83%E3%80%85%E5%AD%A6%E5%9C%92%E3%81%AE%E3%81%82%E3%82%8B%E5%A0%B4%E6%89%80%E3%81%AF%E3%80%81%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE%E3%81%AE" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「元々学園のある場所は、<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>の境外社である「磐長神社」が建てられており、規模は小さいながら村社として近隣の信仰を集めていた。」</p>
<p class="cite"><b>中文机翻</b>学园原址曾建有作为<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>境外社的「磐長神社」，规模虽小，却作为村社聚集了附近的信仰。</p>
</div>
