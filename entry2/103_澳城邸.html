  <h1>澳城邸</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p>位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>东部贝寄町的<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>宅邸。宅地内移建了旧英国大使馆的别墅，以及幕末时期仿造有泽弌通的『明々庵』所建的『鹦鹉庵』等，均被指定为<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>景观重要建筑。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L67~%E6%BE%B3%E5%9F%8E%E9%82%B8%E3%81%AF%E3%80%81%E4%BD%B3%E5%9F%8E%E5%B8%82%E3%81%AE%E6%9D%B1%E3%81%AB%E4%BD%8D%E7%BD%AE%E3%81%99%E3%82%8B%E8%B2%9D%E5%AF%84%E7%94%BA" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「澳城邸は、<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の東に位置する<a class="w" href="../entry2/116_%E8%B2%9D%E5%AF%84%E7%94%BA.html">貝寄町</a>内に存在する<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>の邸宅。」</p>
<p class="cite"><b>中文机翻</b>澳城邸是位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>东部<a class="w" href="../entry2/116_%E8%B2%9D%E5%AF%84%E7%94%BA.html">貝寄町</a>内的<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>宅邸。</p>
