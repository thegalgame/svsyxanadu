  <h1>鷁</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S022_00_a00.txt</span></p>
<p>サギに似た架空の水鳥を意味する『<ruby>鷁<rt>げき</rt></ruby>』 と名づけられた、<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>に代々伝わる刀剣。</p>

<p>被命名为意为『似鹭之幻水鸟』的『鷁』，是<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>世代相传的刀剑。其形制为将两把中反、峰部开刃的刀背相抵合为一柄双刃之剑，呈西洋剑般风貌。刀脊虽施细密镂刻，却整体保持猎师所用『长鞘』般的粗犷厚重，因此仅比小太刀略长，却已单手难握。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L134~%E3%82%B5%E3%82%AE%E3%81%AB%E4%BC%BC%E3%81%9F%E6%9E%B6%E7%A9%BA%E3%81%AE%E6%B0%B4%E9%B3%A5%E3%82%92%E6%84%8F%E5%91%B3%E3%81%99%E3%82%8B%E3%80%8E%E9%B7%81%E3%80%8F" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：S022_00_a00.txt）</p>
