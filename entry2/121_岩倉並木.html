  <h1>岩倉並木</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S006_00_a00.txt</span></p>
<p>こうした蔵は明治時代、<ruby>馬渡石<rt>まといし</rt></ruby>町内に初めて建てられたらしく、今では『<ruby>岩倉並木<rt>いわくらなみき</rt></ruby>』と呼ばれていた。</p>

<p>这一带成排的仓库似于明治时代首建于<a class="w" href="../entry2/114_%E9%A6%AC%E6%B8%A1%E7%9F%B3%E7%94%BA.html">馬渡石町</a>内，如今被称为『岩倉並木』。用以储藏当地收获的米、青果及自全国送来的货物，至今仍在沿用。【机器翻译】</p>
