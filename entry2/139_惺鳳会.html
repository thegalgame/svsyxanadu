  <h1>惺鳳会</h1>
  <p class="catline"><span class="cat">学校·机构</span></p>
<p>运营<a class="w" href="../entry2/138_%E6%83%BA%E9%B3%B3%E9%A4%A8%E5%AD%A6%E5%9C%92.html">惺鳳館学園</a>的学校法人。学园前身为创始人之叔父<a class="w" href="../entry2/145_%E9%81%93%E9%99%B5%E8%95%83%E9%81%B5.html">道陵蕃遵</a>在<a class="w" href="../entry2/135_%E7%A3%90%E9%95%B7%E7%A5%9E%E7%A4%BE.html">磐長神社</a>社务所一隅开设的私塾；战后成为知名升学学校，并为县外考生在<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>内修建数处专用宿舍。【机器翻译】</p>
