  <h1>白鷺町</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S006_00_a00.txt</span></p>
<p><a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>东部之町。是<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>最早繁荣的地域。<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>邸宅（白鷺町）位于此，<a class="w" href="../entry2/138_%E6%83%BA%E9%B3%B3%E9%A4%A8%E5%AD%A6%E5%9C%92.html">惺鳳館学園</a>亦位于市西的白鷺町。【机器翻译】</p>

<p class="cite-h">引用出处</p>

<p class="cite"><b>中文机翻</b>位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西部的白鷺町内。</p>
