  <h1>一重織</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S007_01_a00.txt</span></p>
<p><a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>の模様は「ともすればあだなる風」と名づけられており、<a class="w" href="../entry2/179_%E4%B8%89%E5%8D%81%E5%85%AD%E6%AD%8C%E4%BB%99.html">三十六歌仙</a>の一人である小野小町の歌から採られている。</p>

<p>真田纽端所织、各家相传的独有纹样，四家各不相同，取自<a class="w" href="../entry2/179_%E4%B8%89%E5%8D%81%E5%85%AD%E6%AD%8C%E4%BB%99.html">三十六歌仙</a>的和歌：<a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>『或将随风成泡影』（小野小町）、<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>『春霞迷雁影』（纪友则）、垄峰家『欲问都鸟』（在原业平）、<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>『琴音与峰松风』（斎宮女御）。【机器翻译】</p>
