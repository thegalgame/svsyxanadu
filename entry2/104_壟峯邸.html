  <h1>壟峯邸</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p>位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西北部<a class="w" href="../entry2/113_%E6%97%A5%E8%AB%B8%E6%9C%A8%E7%94%BA.html">日諸木町</a>的<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>宅邸。土地自古未变其址，坐落于通往西北部古道『彌彦抜』的途中。据<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>古文献《<a class="w" href="../entry2/107_%E5%8A%A0%E7%BE%85%E6%A9%8B%E4%B8%89%E4%BB%A3%E8%A8%98.html">加羅橋三代記</a>》记载，该族曾于江户时代以前居住在不设破风的『东屋』式建筑中。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L73~%E5%A3%9F%E5%B3%AF%E9%82%B8%E3%81%AF%E3%80%81%E4%BD%B3%E5%9F%8E%E5%B8%82%E3%81%AE%E5%8C%97%E8%A5%BF%E3%81%AB%E4%BD%8D%E7%BD%AE%E3%81%99%E3%82%8B%E6%97%A5%E8%AB%B8" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「壟峯邸は、<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の北西に位置する<a class="w" href="../entry2/113_%E6%97%A5%E8%AB%B8%E6%9C%A8%E7%94%BA.html">日諸木町</a>内に存在する<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>の邸宅。」</p>
<p class="cite"><b>中文机翻</b>壟峯邸是位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西北<a class="w" href="../entry2/113_%E6%97%A5%E8%AB%B8%E6%9C%A8%E7%94%BA.html">日諸木町</a>内的<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>宅邸。</p>
</div>
