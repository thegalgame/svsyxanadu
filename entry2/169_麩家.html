  <p class="catline"><span class="cat">饮食·店铺</span><span class="src-name">S005_01_a00.txt</span></p>
<p>俺たちが歩いて向かっていた場所――<ruby>生麩<rt>なまふ</rt></ruby>の老舗で有名な『<ruby>麩家<rt>ふうか</rt></ruby>』の前に、立派な車が停まっているのが見えた。</p>

<p>以生麩老铺闻名的『麩家』，店前停着气派的轿车。【机器翻译】</p>
