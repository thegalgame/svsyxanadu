  <h1>席拉（シラット）</h1>
  <p class="catline"><span class="cat">杂学</span><span class="src-name">S107_00_a01.txt</span></p>
<p>「兄さん、シラットって知ってるかい？」</p>

<p>「哥，你知道席拉（Silat）吗？」</p>

<p>所謂的席拉，主要是在東南亞流傳的傳統武術。是和日本的柔術與合氣道接近的技術體系，使用武器的技法，赤手空拳與武器對抗的技法都包含在內。菩乃花所用者，系其出于文化人类学兴趣所学、并混合军队式CQC的自家流派。【机器翻译】／【繁体中文】</p>
