  <h1>岩蜂妙見遺跡群</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S002_02_a00.txt</span></p>
<p><a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の外周に存在する、<ruby>古墳時代<rt>こふんじだい</rt></ruby>から<ruby>鎌倉時代<rt>かまくらじだい</rt></ruby>までの複数の遺跡の総称。</p>

<p>对存在于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>外围、从古坟时代到镰仓时代的多个遗迹的总称。其名称取自<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的通称『<a class="w" href="../entry2/134_%E5%B2%A9%E8%9C%82%E5%A6%99%E8%A6%8B%E5%AE%AE.html">岩蜂妙見宮</a>』。因特异的盆地地形，山麓及山中的各时代居住遗迹在全国亦属罕见，至今发掘调查仍在持续。阿佛尼《十六夜日記》已首次言及其石壁。【机器翻译】</p>

<p class="src" id="s1">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L36~%E4%BD%B3%E5%9F%8E%E5%B8%82%E3%81%AE%E5%A4%96%E5%91%A8%E3%81%AB%E5%AD%98%E5%9C%A8%E3%81%99%E3%82%8B%E3%80%81%E5%8F%A4%E5%A2%B3%E6%99%82%E4%BB%A3%E3%81%8B%E3%82%89" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：<a class="src-l" href="../story1/%E5%B0%91%E5%A5%B3%E7%A5%9E%E5%9F%9F/S002_02_a00.txt.html#L67~%E3%82%AB%E3%83%AB%E3%83%87%E3%83%A9%E7%9B%86%E5%9C%B0%E3%81%AE%E4%B8%AD%E3%81%AB%E3%81%82%E3%82%8B%E7%94%BA%E3%81%A8%E3%81%84%E3%81%86%E3%81%A0%E3%81%91%E3%81%A7">S002_02_a00.txt</a>）</p>
