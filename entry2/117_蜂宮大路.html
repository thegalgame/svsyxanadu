  <h1>蜂宮大路</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S005_01_a00.txt</span></p>
<p><ruby>蜂宮大路<rt>はちみやおおじ</rt></ruby>の名は、市の中央に位置する<ruby>大忌比古<rt>おおいみひこ</rt></ruby>神社に由来している。</p>

<p>纵贯<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>中央南北的大路，其名源自位于市中央的<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>（通称<a class="w" href="../entry2/134_%E5%B2%A9%E8%9C%82%E5%A6%99%E8%A6%8B%E5%AE%AE.html">岩蜂妙見宮</a>）；因自古用作通往神社的参道，故以『<a class="w" href="../entry2/134_%E5%B2%A9%E8%9C%82%E5%A6%99%E8%A6%8B%E5%AE%AE.html">岩蜂妙見宮</a>』取名为『蜂宮大路』。祭礼当天，此路排满贩卖吉祥熊手的露天摊位。【机器翻译】</p>

<p class="src" id="s1">（出处：出自《少女神域∽少女天獄》；剧本文件名：<a class="src-l" href="../story1/%E5%B0%91%E5%A5%B3%E7%A5%9E%E5%9F%9F/S005_01_a00.txt.html#L64~%E3%81%AE%E5%90%8D%E3%81%AF%E3%80%81%E5%B8%82%E3%81%AE%E4%B8%AD%E5%A4%AE%E3%81%AB%E4%BD%8D%E7%BD%AE%E3%81%99%E3%82%8B">S005_01_a00.txt</a>／出自《少女神域∽少女天獄》官方设定集）</p>
