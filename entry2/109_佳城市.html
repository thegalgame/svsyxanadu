  <h1>佳城市</h1>
  <p class="catline"><span class="cat">佳城市·地名</span></p>
<p><ruby>佳城<rt>かいじょう</rt></ruby>市は、かつて活動していた低地火山による特異な盆地を形成しており、中央はなだらかな平野になっているものの、市の外縁部分は一種のカルデラ壁のような地形を成している。</p>

<p>佳城市因一座曾经活动的低地火山而形成了特殊的盆地：中央虽为平缓的平原，城市外缘却构成了类似火山臼壁的地形。主要由白鹭、岩坂、日诸木、马渡石、卷狩、贝寄六个町组成。形成盆地的火山是一座标高一百一十一米的休火山。从外部望去，环绕的石壁宛若石砌的城塞，这也成了城镇名称的由来。【机器翻译】</p>
