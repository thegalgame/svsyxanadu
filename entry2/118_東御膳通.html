  <h1>東御膳通</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S006_00_a00.txt</span></p>
<p>この<ruby>東御膳通<rt>ひがしごぜんどおり</rt></ruby>を西へ直進すれば、数分で学園の校門が見えてくる。</p>

<p>与<a class="w" href="../entry2/119_%E8%91%A6%E5%B1%8B%E7%94%BA%E9%80%9A.html">葦屋町通</a>景观相似、以榉树道与仓库相连的街道。由此街西进数分钟，即可望见学园校门。【机器翻译】</p>
