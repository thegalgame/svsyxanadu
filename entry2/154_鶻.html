  <h1>鶻</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S022_00_a00.txt</span></p>
<p>ハヤブサを意味する『<ruby>鶻<rt>こつ</rt></ruby>』と名づけられた、<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>に代々伝わる刀剣。</p>

<p>被命名为意为『隼』的『鶻』，是垄峰家世代相传的刀剑。其形制接近大陆风格，呈筑紫薙刀般的特异弧线，刃部采用鹈首造手法。外观虽宽大，却因使用特殊钢材而异常轻盈，单手便可轻松挥舞。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L131~%E3%83%8F%E3%83%A4%E3%83%96%E3%82%B5%E3%82%92%E6%84%8F%E5%91%B3%E3%81%99%E3%82%8B%E3%80%8E%E9%B6%BB%E3%80%8F%EF%BC%88%E3%81%93%E3%81%A4%EF%BC%89%E3%81%A8%E5%90%8D" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：S022_00_a00.txt）</p>
