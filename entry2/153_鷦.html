  <h1>鷦</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S022_00_a00.txt</span></p>
<p>ミソサザイを意味する『<ruby>鷦<rt>しょう</rt></ruby>』 と名づけられた、<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>に代々伝わる刀剣。</p>

<p>被命名为意为『鹪鹩』的『鷦』，是<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>世代相传的刀剑。其形制近似古月山刀的直刀，刃身可见极细腻的绫杉肌状波纹。在各家传世刀剑中，它最具典型『日本刀』之姿，同时对使用者的技艺要求也最为严苛。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L129~%E3%83%9F%E3%82%BD%E3%82%B5%E3%82%B6%E3%82%A4%E3%82%92%E6%84%8F%E5%91%B3%E3%81%99%E3%82%8B%E3%80%8E%E9%B7%A6%E3%80%8F%EF%BC%88%E3%81%97%E3%82%87%E3%81%86%EF%BC%89" title="跳转到原文对应位置">官方设定集</a>／出自《少女神域∽少女天獄》；剧本文件名：S022_00_a00.txt）</p>
