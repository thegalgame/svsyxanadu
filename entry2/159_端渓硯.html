  <h1>端渓硯</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span></p>
<p><ruby>端渓硯<rt>たんけいけん</rt></ruby> という種類のもので、中国広東省広州の深山幽谷から掘り出された原石を用いて作られる逸品を指す。</p>

<p>即端溪砚，指以采自中国广东省广州深山幽谷的原石精制而成的珍品。<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>所传的『古伏』即属此类。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L123~%E7%AB%AF%E6%B8%93%E7%A1%AF%EF%BC%88%E3%81%9F%E3%82%93%E3%81%91%E3%81%84%E3%81%91%E3%82%93%EF%BC%89%20%E3%81%A8%E3%81%84%E3%81%86%E7%A8%AE%E9%A1%9E%E3%81%AE" title="跳转到原文对应位置">官方设定集</a>）</p>
