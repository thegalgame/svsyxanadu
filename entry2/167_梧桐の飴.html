  <h1>梧桐の飴</h1>
  <p class="catline"><span class="cat">饮食·店铺</span><span class="src-name">S012_02_a00.txt</span></p>
<p>学園から家に帰る途中――<ruby>白鷺<rt>しらさぎ</rt></ruby>町と<ruby>巻狩<rt>まきがり</rt></ruby>町の境に、自家製の<ruby>飴<rt>あめ</rt></ruby>や駄菓子の老舗である『<ruby>梧桐<rt>ごとう</rt></ruby>の<ruby>飴<rt>あめ</rt></ruby>』があるからだ。</p>

<p>位于<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>与<a class="w" href="../entry2/115_%E5%B7%BB%E7%8B%A9%E7%94%BA.html">巻狩町</a>交界、自制糖果与粗点心的老铺『梧桐の飴』。祥那常在此买杏子糖。【机器翻译】</p>
