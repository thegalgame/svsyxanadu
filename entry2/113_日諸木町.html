  <h1>日諸木町</h1>
  <p class="catline"><span class="cat">佳城市·地名</span></p>
<p><a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>北西部的町。<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>邸宅位于此，为主要氏子<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>的住宅。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L73~%E5%A3%9F%E5%B3%AF%E9%82%B8%E3%81%AF%E3%80%81%E4%BD%B3%E5%9F%8E%E5%B8%82%E3%81%AE%E5%8C%97%E8%A5%BF%E3%81%AB%E4%BD%8D%E7%BD%AE%E3%81%99%E3%82%8B%E6%97%A5%E8%AB%B8" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「<a class="w" href="../entry2/104_%E5%A3%9F%E5%B3%AF%E9%82%B8.html">壟峯邸</a>は、<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の北西に位置する日諸木町内に存在する<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>の邸宅。」</p>
<p class="cite"><b>中文机翻</b><a class="w" href="../entry2/104_%E5%A3%9F%E5%B3%AF%E9%82%B8.html">壟峯邸</a>是位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西北日諸木町内的<a class="w" href="../entry2/100_%E5%A3%9F%E5%B3%AF%E5%AE%B6.html">壟峯家</a>宅邸。</p>
