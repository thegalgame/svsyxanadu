  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S017_01_a00.txt</span></p>
<p>「そうね。一緒に下校して、<ruby>澳城<rt>おくしろ</rt></ruby>の家に帰るときは、よくこの<ruby>狭井通<rt>さいどおり</rt></ruby>を<ruby>通<rt>かよ</rt></ruby>ったわ」</p>

<p>「是啊。以前一起放学、回<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>的时候，常常走这条狭井通呢」——由学园通往<a class="w" href="../entry1/099_%E6%BE%B3%E5%9F%8E%E5%AE%B6.html">澳城家</a>的路。【机器翻译】</p>
