  <h1>毛利隆元</h1>
  <p class="catline"><span class="cat">杂学</span></p>
<p>战国时代著名武将。<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>参道旁留存有其等献灯的大型石灯笼，可见该社自古备受崇敬。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L35~%E5%8F%82%E9%81%93%E3%81%AE%E8%84%87%E3%81%AB%E3%81%AF%E6%AF%9B%E5%88%A9%E9%9A%86%E5%85%83%E3%81%AA%E3%81%A9%E6%88%A6%E5%9B%BD%E6%9C%9F%E3%81%AE%E8%91%97%E5%90%8D" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「参道の脇には毛利隆元など戦国期の著名な武将たちから献燈された大きな石燈籠が残っており、古来から崇敬を集めていたことが窺われる。」</p>
<p class="cite"><b>中文机翻</b>参道旁仍留有毛利隆元等战国时期著名武将捐献的大石灯笼，可见自古便受崇敬。</p>
</div>
