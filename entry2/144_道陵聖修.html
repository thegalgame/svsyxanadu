  <h1>道陵聖修</h1>
  <p class="catline"><span class="cat">学校·机构</span></p>
<p>汉学家。明治三十七年以『惺鳳高等女学校』之名创立<a class="w" href="../entry2/138_%E6%83%BA%E9%B3%B3%E9%A4%A8%E5%AD%A6%E5%9C%92.html">惺鳳館学園</a>。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L87~%E6%98%8E%E6%B2%BB%E4%B8%89%E5%8D%81%E4%B8%83%E5%B9%B4%E3%81%AB%E6%BC%A2%E5%AD%A6%E8%80%85%E3%81%A7%E3%81%82%E3%82%8B%E3%80%8C%E9%81%93%E9%99%B5%E8%81%96%E4%BF%AE" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「明治三十七年に漢学者である「道陵聖修（みちおか せいしゅう）」によって『惺鳳高等女学校』として創立され、戦後の学制改革に伴って共学制となり現在に至る。」</p>
<p class="cite"><b>中文机翻</b>明治三十七年由汉学家「道陵聖修」创立为『惺鳳高等女学校』，战后随学制改革改为共学制并延续至今。</p>
</div>
