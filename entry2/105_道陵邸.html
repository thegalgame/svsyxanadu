  <h1>道陵邸</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p>位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西部<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>的<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>宅邸。最初为拥有复杂屋顶结构的和风建筑，于光文十一年改建为西式风格并留存至今。除大理石玄关与暖炉外，室内装饰艺术风格彩绘玻璃及照明器具悉为大正至光文年间添置。据传为战前侦探小说家<a class="w" href="../entry2/180_%E5%B0%8F%E5%9F%8E%E9%AD%9A%E5%A4%AA%E9%83%8E.html">小城魚太郎</a>名作《圣玛利亚邸杀人事件》中巨大西式宅邸的原型之一。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L79~%E9%81%93%E9%99%B5%E9%82%B8%E3%81%AF%E3%80%81%E4%BD%B3%E5%9F%8E%E5%B8%82%E3%81%AE%E8%A5%BF%E3%81%AB%E4%BD%8D%E7%BD%AE%E3%81%99%E3%82%8B%E7%99%BD%E9%B7%BA%E7%94%BA" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「道陵邸は、<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の西に位置する<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>内に存在する<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>の邸宅。」</p>
<p class="cite"><b>中文机翻</b>道陵邸是位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西部<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>内的<a class="w" href="../entry2/101_%E9%81%93%E9%99%B5%E5%AE%B6.html">道陵家</a>宅邸。</p>
