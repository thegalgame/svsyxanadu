  <h1>道陵家</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p><ruby>道陵<rt>みちおか</rt></ruby>という姓は、「みささぎ=墓」を意味する「陵」への道を現している。</p>

<p>『道陵』一姓，寓意着通往意为「御陵＝墓」的「陵」之路。邸宅位于西部<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>，以代表<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>的近代建筑闻名。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L78~%E9%81%93%E9%99%B5%E3%81%A8%E3%81%84%E3%81%86%E5%A7%93%E3%81%AF%E3%80%81%E3%80%8C%E3%81%BF%E3%81%95%E3%81%95%E3%81%8E%3D%E5%A2%93%E3%80%8D%E3%82%92%E6%84%8F" title="跳转到原文对应位置">官方设定集</a>）</p>
