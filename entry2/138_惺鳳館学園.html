  <h1>惺鳳館学園</h1>
  <p class="catline"><span class="cat">学校·机构</span></p>
<p>明治三十七年に漢学者である「<a class="w" href="../entry2/144_%E9%81%93%E9%99%B5%E8%81%96%E4%BF%AE.html">道陵聖修</a>（みちおか せいしゅう）」によって『<ruby>惺鳳高等女学校<rt>せいほうこうとうじょがっこう</rt></ruby>』として創立され、戦後の学制改革に伴って共学制となり現在に至る。</p>

<p>明治三十七年由汉学家<a class="w" href="../entry2/144_%E9%81%93%E9%99%B5%E8%81%96%E4%BF%AE.html">道陵聖修</a>以『惺鳳高等女学校』之名创立，战后随学制改革改为男女共学并延续至今。由学校法人『<a class="w" href="../entry2/139_%E6%83%BA%E9%B3%B3%E4%BC%9A.html">惺鳳会</a>』运营，位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>西部<a class="w" href="../entry2/111_%E7%99%BD%E9%B7%BA%E7%94%BA.html">白鷺町</a>，每学年学生约二百八十人，简称『惺学』。现任理事長为<a class="w" href="../entry1/073_%E9%81%93%E9%99%B5%E5%BE%97%E5%AD%90.html">道陵得子</a>。【机器翻译】</p>

<p class="src">（出处：出自《少女神域∽少女天獄》<a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L87~%E6%98%8E%E6%B2%BB%E4%B8%89%E5%8D%81%E4%B8%83%E5%B9%B4%E3%81%AB%E6%BC%A2%E5%AD%A6%E8%80%85%E3%81%A7%E3%81%82%E3%82%8B%E3%80%8C%E9%81%93%E9%99%B5%E8%81%96%E4%BF%AE" title="跳转到原文对应位置">官方设定集</a>）</p>
