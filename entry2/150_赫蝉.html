  <h1>赫蝉</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S020_01_a00.txt</span></p>
<p><a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>に代々伝わる<ruby>古玉<rt>こぎょく</rt></ruby>の一種。赤い蝉を象った意匠を持つ。前漢の<ruby>含蝉<rt>がんせん</rt></ruby>、死者の口に含ませる副葬品を模したものではないかとされる。</p>

<p><a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>世代相传的古玉之一，雕有赤蝉图案。被认为是仿照前汉含蝉——含于死者口中的陪葬玉——而制。</p>
<p>「不过，只有设计原型是知道的——我家的是仿照含蝉制作的」【机器翻译】</p>
