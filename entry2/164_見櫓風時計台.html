  <h1>見櫓風時計台</h1>
  <p class="catline"><span class="cat">饮食·店铺</span><span class="src-name">S005_00_a00.txt</span></p>
<p>バスターミナルのそばには江戸時代の<ruby>見櫓<rt>みやぐら</rt></ruby>風の時計台があり、朝、昼、夕方とチャイムが鳴る。</p>

<p>巴士总站旁有一座江户时代瞭望楼（見櫓）风格的钟楼，早、中、晚都会敲响钟声。【机器翻译】</p>
