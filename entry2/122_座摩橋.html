  <h1>座摩橋</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S020_02_a00.txt</span></p>
<p>俺は<ruby>祥那<rt>さな</rt></ruby>のお願いで一緒に学園まで見送ってほしいと言われたが、それは<ruby>無理<rt>・・</rt></ruby>だったので、<ruby>座摩橋<rt>いすかりばし</rt></ruby>の近くまで見送ることになった。</p>

<p>横跨<a class="w" href="../entry2/123_%E5%A4%A7%E7%A5%9E%E5%B7%9D.html">大神川</a>的桥。越过此桥后不久便可到家。位于<a class="w" href="../entry2/119_%E8%91%A6%E5%B1%8B%E7%94%BA%E9%80%9A.html">葦屋町通</a>、沿<a class="w" href="../entry2/117_%E8%9C%82%E5%AE%AE%E5%A4%A7%E8%B7%AF.html">蜂宮大路</a>向北之处。【机器翻译】</p>
