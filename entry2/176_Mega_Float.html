  <h1>Mega Float</h1>
  <p class="catline"><span class="cat">杂学</span><span class="src-name">S032_00_a00.txt</span></p>
<p><ruby>佳城<rt>かいじょう</rt></ruby>湾に<ruby>超大型浮体式構造物<rt>メガフロート</rt></ruby>を建設する予定があるという。</p>

<p>据说计划在佳城湾建造超大型浮体式结构物（Mega Float）。此计划为<a class="w" href="../entry1/070_%E6%BE%B3%E5%9F%8E%E5%BA%83%E5%B8%B8.html">澳城広常</a>扩张权势、推动<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>都市开发的一环。【机器翻译】／【繁体中文】</p>
