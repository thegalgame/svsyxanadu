  <h1>ナハト</h1>
  <p class="catline"><span class="cat">饮食·店铺</span><span class="src-name">S008_03_a00.txt</span></p>
<p>コーヒーは<ruby>馬渡石<rt>まといし</rt></ruby>町にある全国的に知られた珈琲専門店『ナハト』で挽かれた豆だった。</p>

<p>咖啡用的是<a class="w" href="../entry2/114_%E9%A6%AC%E6%B8%A1%E7%9F%B3%E7%94%BA.html">馬渡石町</a>那家全国知名的咖啡专卖店『ナハト（Nacht）』研磨的豆子。店主为菩乃花多年友人<a class="w" href="../entry1/086_%E5%BF%97%E5%85%8D%E6%9C%A8%E4%B8%80%E8%80%83.html">志免木一考</a>。【机器翻译】</p>
