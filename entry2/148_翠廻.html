  <h1>翠廻</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span></p>
<p>翠色の這い回る蛇を象った意匠を持つ。秦時代のものではないかとされる。</p>

<p>垄峰家世代相传的古玉之一，雕有翠色盘绕之蛇的纹样。推测为秦代之物。【机器翻译】</p>
