  <h1>鴦</h1>
  <p class="catline"><span class="cat">神具·古玉·宝刀</span><span class="src-name">S020_00_a00.txt</span></p>
<p>それは――『<ruby>鴦<rt>おう</rt></ruby>』と呼ばれる、<ruby>稜祁<rt>たかぎ</rt></ruby>家に伝わる宝剣だった。毎年、<ruby>星鴻祭<rt>せいこうさい</rt></ruby>に持ち出され、奥社に奉じられる<ruby>神具<rt>しんぐ</rt></ruby>の一つだ。</p>

<p>意为雌鸳鸯的『鴦』，是<a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>世代相传的宝剑。每年<a class="w" href="../entry1/048_%E6%98%9F%E9%B4%BB%E7%A5%AD.html">星鴻祭</a>时被取出、奉于奥社的神具之一。其形制为镐造、锋部双刃的古代剑风格短刀，柄头装有两枚游环。保存状态逊于他家传世之刀，且破损痕迹显非自然老化所致。【机器翻译】</p>

<p class="src" id="s1">（出处：出自《少女神域∽少女天獄》；剧本文件名：<a class="src-l" href="../story1/%E5%B0%91%E5%A5%B3%E7%A5%9E%E5%9F%9F/S020_00_a00.txt.html#L122~%E3%81%9D%E3%82%8C%E3%81%AF%5B%E2%80%95%E2%80%95%5D%E3%80%8E%5B%E9%B4%A6%2C%E3%81%8A%E3%81%86%5D%E3%80%8F%E3%81%A8%E5%91%BC%E3%81%B0">S020_00_a00.txt</a>／出自《少女神域∽少女天獄》官方设定集）</p>
