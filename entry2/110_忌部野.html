  <h1>忌部野</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S002_02_a00.txt</span></p>
<p>それまでは、<ruby>忌部野<rt>いべの</rt></ruby>という古い土地の名前で呼ばれていた。</p>

<p><a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>的古名。往来于江户与上方之间的菱垣回船与樽回船的船员，望见耸立于佳城湾的山峦与『石壁』，最先称其为『海之城』——此即『佳城』一名之始。在此之前，此地一直唤作忌部野这一古老地名。【机器翻译】</p>
