  <h1>鴻山</h1>
  <p class="catline"><span class="cat">佳城市·地名</span><span class="src-name">S005_02_a00.txt</span></p>
<p>実家のある<ruby>鴻山<rt>おおとりやま</rt></ruby>までやってくると、周りに民家が少なくなりはじめる。</p>

<p><a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>所在的平缓山丘，山中有<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的奥社。虽名山，实则极为平缓，古旧石灯笼比信号灯与电线杆更显眼，是<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>中较为寂寥之地。【机器翻译】</p>
