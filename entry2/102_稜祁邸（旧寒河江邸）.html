  <h1>稜祁邸（旧寒河江邸）</h1>
  <p class="catline"><span class="cat">四家·门第</span></p>
<p>稜祁邸は、二階建ての近代建築物で<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>の中央に位置する。一般的には『<ruby>旧寒河江邸<rt>きゅうさがえてい</rt></ruby>』として近代建築物の著名な物件として知られているが、現在は「<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>」の氏子筆頭である<a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>の住宅として利用されている。</p>

<p>稜祁邸是位于<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>中央的二层近代建筑。一般作为近代建筑的著名物业以『旧寒河江邸』之名为人所知，现今用作<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>首席氏子<a class="w" href="../entry1/097_%E7%A8%9C%E7%A5%81%E5%AE%B6.html">稜祁家</a>的住宅。已被指定为<a class="w" href="../entry2/109_%E4%BD%B3%E5%9F%8E%E5%B8%82.html">佳城市</a>景观重要建筑。【机器翻译】</p>
