<p>「ただし、デザイン元だけはわかっている――ウチのは、<ruby>含蝉<rt>がんせん</rt></ruby>を模したものだよ」</p>

<p>「不过，只有设计原型是知道的——我家的是仿照含蝉制作的」——前汉用于含于死者口中的陪葬玉，赫蝉即摹其形。【机器翻译】</p>
