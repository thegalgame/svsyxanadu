  <h1>大江広元</h1>
  <p class="catline"><span class="cat">杂学</span><span class="src-name">S022_01_a00.txt</span></p>
<p>この<ruby>大忌比古<rt>おおいみひこ</rt></ruby>神社を実際に建てた、鎌倉幕府の要人である<ruby>大江広元<rt>おおえのひろもと</rt></ruby>の先祖にあたった。</p>

<p>『<a class="w" href="../entry2/108_%E5%9C%9F%E5%B8%AB%E5%AE%BF%E7%A6%B0.html">土師宿禰</a>』为古代擅长建筑的氏族，正是实际建造<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的镰仓幕府要人——大江広元的先祖。大江広元参与神社大规模营建工事一事有记录留存，其时确定了现今规模，故研究上他被确信为实质性的创建者。【机器翻译】</p>
