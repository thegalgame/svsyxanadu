  <h1>土師宿禰</h1>
  <p class="catline"><span class="cat">四家·门第</span><span class="src-name">S022_01_a00.txt</span></p>
<p>『<ruby>土師宿禰<rt>はじすくね</rt></ruby>』とは、古代の建築を得意とした氏族を指す。そして、この<ruby>大忌比古<rt>おおいみひこ</rt></ruby>神社を実際に建てた、鎌倉幕府の要人である<ruby>大江広元<rt>おおえのひろもと</rt></ruby>の先祖にあたった。</p>

<p>『土師宿禰』指的是古代擅长建筑的氏族，也正是实际建造了<a class="w" href="../entry2/133_%E5%A4%A7%E5%BF%8C%E6%AF%94%E5%8F%A4%E7%A5%9E%E7%A4%BE.html">大忌比古神社</a>的镰仓幕府要人——<a class="w" href="../entry2/177_%E5%A4%A7%E6%B1%9F%E5%BA%83%E5%85%83.html">大江広元</a>的先祖。神社境内立有『土師宿禰九頭龍磐境創建之地』的石碑。【机器翻译】</p>
