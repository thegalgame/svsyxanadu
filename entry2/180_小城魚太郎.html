  <h1>小城魚太郎</h1>
  <p class="catline"><span class="cat">杂学</span></p>
<p>战前侦探小说家。其名作《圣玛利亚邸杀人事件》（セントマリアていさつじんじけん）中出现的巨大西式宅邸，据说以<a class="w" href="../entry2/105_%E9%81%93%E9%99%B5%E9%82%B8.html">道陵邸</a>为原型之一。【机器翻译】</p>

<p class="cite-h">引用出处</p>
<div class="cite-g" id="c1">
<p class="cite-src"><a class="src-l" href="../story1/%E5%85%B6%E4%BB%96%E8%B5%84%E6%96%99/%E8%AE%BE%E5%AE%9A%E7%94%A8%E8%AF%AD%E9%9B%86_%E6%97%A5%E6%96%87%E5%8E%9F%E6%96%87.html#L83~%E6%88%A6%E5%89%8D%E3%81%AE%E6%8E%A2%E5%81%B5%E5%B0%8F%E8%AA%AC%E5%AE%B6%E3%81%A7%E3%81%82%E3%82%8B%E5%B0%8F%E5%9F%8E%E9%AD%9A%E5%A4%AA%E9%83%8E%E3%81%AE%E5%90%8D" title="跳转到原文对应位置">設定用語集</a>：</p>
<p class="cite"><b>日语原文</b>「戦前の探偵小説家である小城魚太郎の名作『聖瑪利亜邸殺人事件』に登場する、巨大洋館のモデルの一つと言われている。」</p>
<p class="cite"><b>中文机翻</b>据称是战前侦探小说家小城魚太郎名作《聖瑪利亜邸殺人事件》中巨大洋馆的原型之一。</p>
