  <h1>日真館大学</h1>
  <p class="catline"><span class="cat">学校·机构</span><span class="src-name">S005_01_a00.txt</span></p>
<p>卒業後の進路は俺や<ruby>迪希<rt>ゆき</rt></ruby>と異なり、<ruby>綱坂<rt>つなさか</rt></ruby>さんは首都にある難関の<ruby>日真館<rt>にっしんかん</rt></ruby>大学に合格した。</p>

<p>位于首都的难关大学。纲坂葵考入该校，因而得以离开佳城独自生活一年。【机器翻译】</p>
